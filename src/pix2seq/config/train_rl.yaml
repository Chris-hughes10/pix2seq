# RL Training Configuration for Pix2Seq
# REINFORCE fine-tuning on recall reward + IoU-supervised confidences
# ("Tuning Computer Vision Models with Task Rewards", arXiv:2302.08242)

data:
  num_classes: 80
  max_instances: 100
  image_size: 640
  jitter_scale: [0.3, 2.0]
  color_jitter_strength: 0.5

tokenization:
  quantization_bins: 1000
  noise_bbox_weight: 1.0
  eos_token_weight: 0.1

model:
  patch_size: 16
  num_encoder_layers: 6
  num_decoder_layers: 6
  d_model: 256
  nhead: 8
  dim_feedforward: 1024
  # Dropout must stay 0 for RL fine-tuning: rollouts sample in eval mode while
  # re-scoring runs in train mode, and the two distributions must match
  dropout: 0.0
  drop_path: 0.0
  shared_decoder_embedding: true
  decoder_output_bias: true
  llama_model: false

training:
  output_dir: "./outputs_rl"
  num_epochs: 50
  # Per-device batch size of images; the effective generation batch is
  # batch_size * rl.num_samples_per_image sequences
  batch_size: 8
  eval_batch_size: 50
  gradient_accumulation_steps: 4
  learning_rate: 0.000006  # Lower LR for fine-tuning
  weight_decay: 0.05
  beta1: 0.9
  beta2: 0.95
  eps: 0.00000001
  # LR schedule: linear warmup (in optimizer updates) then "constant" or "cosine"
  warmup_steps: 500
  lr_schedule: "constant"

evaluation:
  eval_frequency: 5  # Evaluate mAP every N epochs
  confidence_threshold: 0.05

# RL-specific settings
rl:
  algorithm: "reinforce"  # "ppo" reserved for future clipped-objective support

  # Advantage baseline: "loo" (leave-one-out mean of the other samples,
  # paper-style), "mean", "grpo" ((r - mean)/std), or "greedy" (SCST)
  advantage_type: "loo"

  # Number of sequences sampled per image (K). Must be >= 2 for
  # loo/mean/grpo; "greedy" also works with 1
  num_samples_per_image: 4

  # Sampling for rollouts: full temperature distribution. top_k/top_p must
  # stay 0 - truncated sampling would bias the policy gradient
  sampling:
    temperature: 1.0
    top_k: 0
    top_p: 0.0

  # Reward settings
  reward:
    iou_thresholds: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]

  # IoU supervision loss (trains confidence scores to predict box IoU;
  # needed for recall gains to translate into mAP gains)
  iou_supervision:
    enabled: true
    weight: 1.0
    min_iou_threshold: 0.0

  # Optional extra whitening of advantages across the batch
  normalize_advantages: false

  # Gradient clipping
  max_grad_norm: 1.0
