# RL Training Configuration for Pix2Seq
# Extends base training config with SCST/REINFORCE settings

# Inherit base data settings
data:
  num_classes: 80
  max_instances: 100
  class_label_corruption: "none"  # No corruption during RL fine-tuning
  image_size: 640
  jitter_scale: [0.3, 2.0]
  color_jitter_strength: 0.5

tokenization:
  quantization_bins: 1000
  noise_bbox_weight: 1.0
  eos_token_weight: 0.1
  mix_rate: 0.5
  random_ordering: true

model:
  patch_size: 16
  num_encoder_layers: 6
  num_decoder_layers: 6
  d_model: 256
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0  # No dropout during RL fine-tuning
  drop_path: 0.0
  shared_decoder_embedding: true
  decoder_output_bias: true
  pad_token_id: 0
  eos_token_id: 1
  llama_model: false

training:
  output_dir: "./outputs_rl"
  predictions_dir: "predictions"
  num_epochs: 50  # Fewer epochs for fine-tuning
  max_steps: null
  batch_size: 16  # Smaller batch size (RL needs more memory for sampling)
  eval_batch_size: 50
  gradient_accumulation_steps: 4  # Effective batch size = 64
  gradient_clip_value: null
  learning_rate: 0.000006  # Lower LR for fine-tuning
  weight_decay: 0.05
  warmup_epochs: 2
  beta1: 0.9
  beta2: 0.95
  eps: 0.00000001
  run_eval_freq: 5
  overfit_eval_set: false
  num_visualizations: 5
  use_wsd_scheduler: true

generation:
  top_p: 0.4
  top_k: 0
  temperature: 1.0

# RL-specific settings
rl:
  enabled: true
  algorithm: "reinforce"  # "reinforce" or "ppo" (future)

  # Baseline type for variance reduction
  baseline: "greedy"  # "greedy" (SCST) or "sample_mean"

  # Reward settings
  reward:
    type: "recall"
    iou_thresholds: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
    use_class_weights: false
    confidence_threshold: 0.0

  # IoU supervision loss
  iou_supervision:
    enabled: true
    weight: 1.0
    min_iou_threshold: 0.0

  # Advantage normalization
  normalize_advantages: true

  # Gradient clipping
  max_grad_norm: 1.0
